# A tiny "metrics API" to practise Deployments, Services, scaling and rollouts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cx-metrics-api
  labels: {app: cx-metrics-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: cx-metrics-api}
  template:
    metadata:
      labels: {app: cx-metrics-api}
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args: ["-text=cx-metrics v1", "-listen=:5678"]
          ports: [{containerPort: 5678}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 5678}
---
apiVersion: v1
kind: Service
metadata:
  name: cx-metrics-api
spec:
  selector: {app: cx-metrics-api}
  ports: [{port: 80, targetPort: 5678}]
